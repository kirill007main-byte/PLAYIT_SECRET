[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-opjoin"
version = "0.1.0"
description = "Grants operator to listed player names on join"
requires-python = ">=3.10"
dependencies = ["endstone>=0.11"]

[project.entry-points."endstone"]
opjoin = "opjoin:OpJoinPlugin"

[tool.setuptools.packages.find]
where = ["src"]
