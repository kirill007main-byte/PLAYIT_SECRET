name: Minecraft Endstone Server (NetherNet)

on:
  workflow_dispatch:
    inputs:
      restore_run_id:
        description: "ID запуска, из артефакта которого восстановить мир (пусто = из кэша)"
        required: false
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: endstone
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Endstone (Minecraft 26.60) and PyYAML
        run: |
          pip install "endstone==0.11.15" pyyaml
          pip list 2>/dev/null | grep -i -E "endstone|pyyaml"

      - name: Restore world from artifact (optional)
        if: inputs.restore_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: endstone-world-${{ inputs.restore_run_id }}
          path: bedrock_server/worlds
          run-id: ${{ inputs.restore_run_id }}
          github-token: ${{ github.token }}

      - name: Restore world (Endstone cache)
        id: restore_es
        if: inputs.restore_run_id == ''
        uses: actions/cache/restore@v4
        with:
          path: |
            bedrock_server/worlds
            bedrock_server/server.properties
            bedrock_server/allowlist.json
            bedrock_server/permissions.json
          key: es-world-${{ github.run_id }}
          restore-keys: es-world-

      - name: Apply repo configs
        run: |
          mkdir -p bedrock_server
          [ -d config ] && cp -r config/. bedrock_server/ || true

      - name: Prepare WaterdogPE
        env:
          WATERDOG_SETTINGS: ${{ secrets.WATERDOG_SETTINGS }}
        run: |
          if [ -z "$WATERDOG_SETTINGS" ]; then
            echo "::error::Секрет WATERDOG_SETTINGS не задан (вставьте туда config.yml из Configuration help в playit)"
            exit 1
          fi
          mkdir -p waterdog
          curl -fL -o waterdog/Waterdog.jar \
            https://github.com/WaterdogPE/WaterdogPE/releases/latest/download/Waterdog.jar
          cd waterdog
          # первый запуск создаёт config.yml по умолчанию
          timeout 40 java -Xms128M -Xmx512M -jar Waterdog.jar < /dev/null > first-run.log 2>&1 || true
          test -f config.yml || { echo "::error::Waterdog не создал config.yml"; tail -n 30 first-run.log; exit 1; }
          python - <<'PY'
          import os, sys, yaml
          snippet = yaml.safe_load(os.environ["WATERDOG_SETTINGS"])
          if not isinstance(snippet, dict):
              sys.exit("WATERDOG_SETTINGS должен быть YAML-словарём (разделы listener, servers, nethernet и т.д.)")
          with open("config.yml") as f:
              cfg = yaml.safe_load(f) or {}
          cfg.update(snippet)
          with open("config.yml", "w") as f:
              yaml.safe_dump(cfg, f, sort_keys=False, allow_unicode=True)
          print("Применены разделы:", ", ".join(snippet.keys()))
          PY

      - name: Start playit agent
        run: |
          curl -fL -o playit https://github.com/playit-cloud/playit-agent/releases/download/v1.2.0/playit-linux-amd64
          chmod +x playit
          nohup ./playit --secret "${{ secrets.PLAYIT_SECRET }}" --socket-path /tmp/playit.sock --log-path "$PWD/playit.log" > playit.out 2>&1 &
          sleep 10
          head -n 20 playit.log || true

      - name: Run server
        run: |
          rm -f console server.log
          mkfifo console
          touch server.log
          ( setsid nohup bash -c 'tail -f console | endstone -y --no-interactive > server.log 2>&1' > /dev/null 2>&1 & )
          for i in $(seq 1 90); do
            grep -q "Server started" server.log && break
            sleep 2
          done
          ( cd waterdog && setsid nohup java -Xms128M -Xmx512M -jar Waterdog.jar < /dev/null > ../waterdog.log 2>&1 & )
          tail -f server.log &
          tail -f waterdog.log &
          sleep 20700

      - name: Stop server gracefully
        if: always()
        run: |
          pkill -f Waterdog.jar || true
          if pgrep -f bedrock_server > /dev/null; then
            timeout 5 bash -c 'echo "stop" > console' || true
            for i in $(seq 1 60); do
              pgrep -f bedrock_server > /dev/null || break
              sleep 2
            done
          fi
          tail -n 20 server.log || true

      - name: Save world and configs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            bedrock_server/worlds
            bedrock_server/server.properties
            bedrock_server/allowlist.json
            bedrock_server/permissions.json
          key: es-world-${{ github.run_id }}

      - name: Backup world (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endstone-world-${{ github.run_id }}
          path: bedrock_server/worlds
          retention-days: 14

      - name: Restart (auto)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run endstone.yml
