name: Minecraft Bedrock Server

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: bedrock
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Download Bedrock Dedicated Server
        run: |
          mkdir -p server && cd server
          URL=$(curl -s https://net-secondary.web.minecraft-services.net/api/v1.0/download/links \
            | jq -r '.result.links[] | select(.downloadType=="serverBedrockLinux") | .downloadUrl')
          echo "Downloading $URL"
          curl -L -A "Mozilla/5.0" -o bds.zip "$URL"
          unzip -q -o bds.zip
          chmod +x bedrock_server

      - name: Restore world and configs
        uses: actions/cache/restore@v4
        with:
          path: |
            server/worlds
            server/server.properties
            server/allowlist.json
            server/permissions.json
          key: bds-world-${{ github.run_id }}
          restore-keys: bds-world-

      - name: Apply repo configs
        run: |
          [ -d config ] && cp -r config/. server/ || true

      - name: Start tunnel
        run: |
          docker run -d --rm --net=host \
            -e SECRET_KEY="${{ secrets.PLAYIT_SECRET }}" \
            ghcr.io/playit-cloud/playit-agent:1.0

      - name: Run server
        working-directory: server
        run: |
          rm -f console server.log
          mkfifo console
          touch server.log
          # сервер запускается отдельно от шага, чтобы пережить отмену
          ( setsid nohup bash -c 'tail -f console | LD_LIBRARY_PATH=. ./bedrock_server > server.log 2>&1' > /dev/null 2>&1 & )
          tail -f server.log &
          sleep 20700

      - name: Stop server gracefully
        if: always()
        working-directory: server
        run: |
          if pgrep -x bedrock_server > /dev/null; then
            timeout 5 bash -c 'echo "stop" > console' || true
            for i in $(seq 1 60); do
              pgrep -x bedrock_server > /dev/null || break
              sleep 2
            done
          fi
          tail -n 15 server.log || true

      - name: Save world and configs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            server/worlds
            server/server.properties
            server/allowlist.json
            server/permissions.json
          key: bds-world-${{ github.run_id }}

      - name: Backup world (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-world-${{ github.run_id }}
          path: server/worlds
          retention-days: 14

      - name: Restart (auto)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bedrock.yml
